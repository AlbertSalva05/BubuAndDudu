<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost, Dudu? — Bubu &amp; Dudu</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='9' fill='%236fa8e8'/%3E%3Ccircle cx='21' cy='16' r='9' fill='%23e8707a' fill-opacity='.9'/%3E%3C/svg%3E">
<style>
:root{--bg:oklch(0.15 0.028 265);--text:oklch(0.97 0.008 80);--muted:oklch(0.79 0.018 262);--blue:oklch(0.82 0.09 250);--red:oklch(0.82 0.09 18);--focus:oklch(0.84 0.1 85)}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;text-align:center}
main{max-width:32rem;display:flex;flex-direction:column;align-items:center;gap:24px}
.code{font-family:Georgia,serif;font-size:clamp(4rem,18vw,7rem);line-height:1;margin:0}
.code span:first-child{color:var(--blue)}.code span:last-child{color:var(--red);font-style:italic}
h1{font-family:Georgia,serif;font-weight:400;font-size:2rem;line-height:1.25;margin:0}
p{margin:0;color:var(--muted);font-size:1.125rem}
a{display:inline-flex;align-items:center;min-height:44px;padding:8px 24px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;text-decoration:none}
a:hover{background:var(--blue)}
a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true"><span>40</span><span>4</span></p>
<h1>This page wandered off, Dudu.</h1>
<p>Probably Chuckie again. Everything important is back home.</p>
<a href="/">Take me back to us →</a>
</main>
</body>
</html>
